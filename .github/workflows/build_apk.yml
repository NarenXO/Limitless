name: Build APK

on:
  push:
    branches: [ "feature/deaf-camera" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradlew permissions & line endings
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Configure local.properties & Accept Licenses
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

    - name: Build Debug APK
      run: bash ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk